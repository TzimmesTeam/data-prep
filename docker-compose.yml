services:
  data-prep:
    build:
      context: .
      args:
        GO_VERSION: "1.24.9"
        MAIN_PACKAGE: github.com/TzimmesTeam/data-prep/cmd/prep
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      bucket-init:
        condition: service_completed_successfully
      control-plane-stub:
        condition: service_started

  minio:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_NOTIFY_WEBHOOK_ENABLE_RAW_EVENTS: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_RAW_EVENTS: "http://event-bridge:8080/events"
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_RAW_EVENTS: "/tmp/minio-events"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    depends_on:
      event-bridge:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 2s
      retries: 20

  bucket-init:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/raw local/curated local/quarantine &&
        case "$(mc event ls local/raw)" in
          *arn:minio:sqs::RAW_EVENTS:webhook*) ;;
          *) mc event add local/raw arn:minio:sqs::RAW_EVENTS:webhook --event put --suffix .csv &&
             mc event add local/raw arn:minio:sqs::RAW_EVENTS:webhook --event put --suffix .xlsx &&
             mc event add local/raw arn:minio:sqs::RAW_EVENTS:webhook --event put --suffix .xlsm ;;
        esac

  event-bridge:
    build:
      context: .
      dockerfile: deploy/event-bridge/Dockerfile
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: "http://localstack:4566"
      SQS_QUEUE_URL: "http://localstack:4566/000000000000/data-prep-raw-events"
    depends_on:
      localstack:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/init.sh:/etc/localstack/init/ready.d/init.sh:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 2s
      retries: 40

  control-plane-stub:
    image: mendhak/http-https-echo:31
    environment:
      HTTP_PORT: 8080
    ports:
      - "8081:8080"

volumes:
  minio-data:
  localstack-data:
