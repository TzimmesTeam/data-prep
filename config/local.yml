env: "local"
startup_timeout: 30s

http:
  port: 8080
  shutdown_timeout: 15s

s3:
  region: "us-east-1"
  endpoint: "http://minio:9000"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"
  use_path_style: true
  raw_bucket: "raw"
  curated_bucket: "curated"
  quarantine_bucket: "quarantine"

sqs:
  region: "us-east-1"
  endpoint: "http://localstack:4566"
  queue_url: "http://localstack:4566/000000000000/data-prep-raw-events"
  access_key_id: "test"
  secret_access_key: "test"
  wait_time_seconds: 20
  visibility_timeout: 300
  reconnect_delay: 2s

control_plane:
  url: "http://control-plane-stub:8080/snapshots/prepared"
  timeout: 10s
  max_attempts: 3
  retry_delay: 1s
